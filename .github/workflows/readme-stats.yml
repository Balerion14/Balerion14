permissions:
  contents: write

name: Update README with GitHub Stats

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GitHub Token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "ERROR: GH_STATS_TOKEN secret is missing or empty"
            exit 1
          fi

          status=$(curl -s \
            -o /tmp/github-user.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)

          echo "GitHub API status: $status"

          if [ "$status" != "200" ]; then
            cat /tmp/github-user.json
            exit 1
          fi

          jq -r '"Authenticated as: " + .login' /tmp/github-user.json

      - name: Generate GitHub Stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          API_VERSION="2022-11-28"

          # Only these languages are allowed in the final stats.
          ALLOWED_LANGUAGES='[
            "Python",
            "TypeScript",
            "JavaScript",
            "Go",
            "Java",
            "C",
            "C++",
            "Kotlin",
            "Svelte",
            "Rust",
            "Dart",
            "Swift",
            "R"
          ]'

          # Frequency:
          # {
          #   "Python": 12,
          #   "TypeScript": 8,
          #   "Go": 5
          # }
          echo '{}' > language_frequency.json

          # Volume in bytes:
          # {
          #   "Python": 2500000,
          #   "TypeScript": 1800000,
          #   "Go": 900000
          # }
          echo '{}' > language_volume.json

          : > repos.txt

          page=1
          total_stars=0
          total_forks=0
          total_size=0

          # --------------------------------------------------
          # Fetch all accessible non-fork repositories
          # --------------------------------------------------

          while true; do
            echo "Fetching repositories page $page..."

            status=$(curl -s \
              -o /tmp/repos.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/user/repos?visibility=all&affiliation=owner%2Ccollaborator%2Corganization_member&per_page=100&page=$page")

            if [ "$status" != "200" ]; then
              echo "Repositories API failed:"
              cat /tmp/repos.json
              exit 1
            fi

            count=$(jq 'length' /tmp/repos.json)

            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -r '
              .[]
              | select(.fork == false)
              | .full_name
            ' /tmp/repos.json >> repos.txt

            page_stars=$(jq '
              [
                .[]
                | select(.fork == false)
                | .stargazers_count
              ]
              | add // 0
            ' /tmp/repos.json)

            page_forks=$(jq '
              [
                .[]
                | select(.fork == false)
                | .forks_count
              ]
              | add // 0
            ' /tmp/repos.json)

            page_size=$(jq '
              [
                .[]
                | select(.fork == false)
                | .size
              ]
              | add // 0
            ' /tmp/repos.json)

            total_stars=$((total_stars + page_stars))
            total_forks=$((total_forks + page_forks))
            total_size=$((total_size + page_size))

            page=$((page + 1))
          done

          sort -u repos.txt -o repos.txt

          repo_count=$(wc -l < repos.txt)

          echo "Repositories included: $repo_count"

          processed_count=0
          failed_count=0

          # --------------------------------------------------
          # Calculate language frequency + volume
          # --------------------------------------------------

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            status=$(curl -s \
              -o /tmp/languages-response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/repos/$repo/languages")

            if [ "$status" != "200" ]; then
              failed_count=$((failed_count + 1))
              continue
            fi

            processed_count=$((processed_count + 1))

            # Keep only languages from our allowlist.
            jq \
              --argjson allowed "$ALLOWED_LANGUAGES" '
                with_entries(
                  select(
                    .key as $language
                    | $allowed
                    | index($language) != null
                  )
                )
              ' /tmp/languages-response.json > /tmp/filtered-languages.json

            # --------------------------------------------------
            # Frequency:
            # each language gets +1 if it exists in this repo.
            # --------------------------------------------------

            jq '
              keys
            ' /tmp/filtered-languages.json > /tmp/repo-language-keys.json

            jq \
              --slurpfile repo_langs /tmp/repo-language-keys.json '
                reduce ($repo_langs[0][]) as $language
                  (.;
                    .[$language] =
                      ((.[$language] // 0) + 1)
                  )
              ' language_frequency.json > language_frequency.tmp.json

            mv language_frequency.tmp.json language_frequency.json

            # --------------------------------------------------
            # Volume:
            # add the GitHub Linguist byte counts.
            # --------------------------------------------------

            jq -s '
              reduce .[] as $item
                ({};
                  reduce ($item | to_entries[]) as $entry
                    (.;
                      .[$entry.key] =
                        ((.[$entry.key] // 0) + $entry.value)
                    )
                )
            ' language_volume.json /tmp/filtered-languages.json \
              > language_volume.tmp.json

            mv language_volume.tmp.json language_volume.json

          done < repos.txt

          echo "Repositories processed: $processed_count"
          echo "Repositories failed: $failed_count"

          # --------------------------------------------------
          # Debug summary
          # --------------------------------------------------

          echo ""
          echo "================================"
          echo "Language frequency"
          echo "================================"

          jq . language_frequency.json

          echo ""
          echo "================================"
          echo "Language volume"
          echo "================================"

          jq . language_volume.json

          # --------------------------------------------------
          # Totals
          # --------------------------------------------------

          total_frequency=$(jq '
            [.[]]
            | add // 0
          ' language_frequency.json)

          total_volume=$(jq '
            [.[]]
            | add // 0
          ' language_volume.json)

          echo ""
          echo "Total frequency occurrences: $total_frequency"
          echo "Total language bytes: $total_volume"

          # --------------------------------------------------
          # Hybrid score
          #
          # score =
          #   70% frequency share
          # + 30% code volume share
          #
          # Example:
          #
          # frequency_share = repo_count_for_language / total_frequency
          # volume_share    = bytes_for_language / total_volume
          #
          # score =
          #   0.70 * frequency_share
          # + 0.30 * volume_share
          #
          # Final scores sum to 100%.
          # --------------------------------------------------

          jq -n \
            --slurpfile frequency language_frequency.json \
            --slurpfile volume language_volume.json \
            --argjson total_frequency "$total_frequency" \
            --argjson total_volume "$total_volume" '
              (
                ($frequency[0] | keys)
                +
                ($volume[0] | keys)
                | unique
              )
              | map(
                  . as $language

                  | ($frequency[0][$language] // 0) as $freq
                  | ($volume[0][$language] // 0) as $bytes

                  | (
                      if $total_frequency > 0
                      then ($freq / $total_frequency)
                      else 0
                      end
                    ) as $frequency_share

                  | (
                      if $total_volume > 0
                      then ($bytes / $total_volume)
                      else 0
                      end
                    ) as $volume_share

                  | {
                      language: $language,
                      frequency: $freq,
                      bytes: $bytes,
                      frequency_share: $frequency_share,
                      volume_share: $volume_share,
                      score: (
                        ($frequency_share * 0.70)
                        +
                        ($volume_share * 0.30)
                      )
                    }
                )
              | sort_by(.score)
              | reverse
            ' > hybrid_stats.json

          echo ""
          echo "================================"
          echo "Hybrid language scores"
          echo "================================"

          jq . hybrid_stats.json

          # Convert scores to percentages.
          #
          # Format:
          # Language<TAB>repo_count<TAB>bytes<TAB>percentage

          jq -r '
            .[:10]
            | .[]
            | [
                .language,
                .frequency,
                .bytes,
                (.score * 100)
              ]
            | @tsv
          ' hybrid_stats.json > stats.tsv

          echo ""
          echo "================================"
          echo "Final language stats"
          echo "================================"

          cat stats.tsv

          # --------------------------------------------------
          # Global GitHub Stats card
          # --------------------------------------------------

          cat > github-stats-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="210"
               viewBox="0 0 500 210">

            <rect
              width="100%"
              height="100%"
              rx="8"
              fill="#141321"
              stroke="#30363d"
            />

            <text
              x="25"
              y="38"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700"
              fill="#fe428e">
              Balerion14's GitHub Stats
            </text>

            <text
              x="25"
              y="85"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Repositories
            </text>

            <text
              x="470"
              y="85"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $repo_count
            </text>

            <text
              x="25"
              y="120"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Stars
            </text>

            <text
              x="470"
              y="120"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $total_stars
            </text>

            <text
              x="25"
              y="155"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Forks
            </text>

            <text
              x="470"
              y="155"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $total_forks
            </text>

            <text
              x="25"
              y="190"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Repository size
            </text>

            <text
              x="470"
              y="190"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              ${total_size} KB
            </text>

          </svg>
          EOF

          # --------------------------------------------------
          # Top Languages card
          # --------------------------------------------------

          ROWS=$(wc -l < stats.tsv)
          HEIGHT=$((80 + ROWS * 30))

          cat > top-langs-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="$HEIGHT"
               viewBox="0 0 500 $HEIGHT">

            <rect
              width="100%"
              height="100%"
              rx="8"
              fill="#141321"
              stroke="#30363d"
            />

            <text
              x="20"
              y="35"
              font-family="Arial, sans-serif"
              font-size="18"
              font-weight="700"
              fill="#fe428e">
              Most Used Languages
            </text>
          EOF

          y=70

          while IFS=$'\t' read -r language frequency bytes percentage; do
            [ -z "$language" ] && continue

            percentage=$(printf "%.1f" "$percentage")

            language_escaped=$(printf '%s' "$language" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g')

            cat >> top-langs-card.svg <<EOF
            <text
              x="20"
              y="$y"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#a9fef7">
              $language_escaped
            </text>

            <text
              x="470"
              y="$y"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#f8d847">
              ${percentage}%
            </text>
          EOF

            y=$((y + 30))
          done < stats.tsv

          echo '</svg>' >> top-langs-card.svg

          # --------------------------------------------------
          # Cleanup
          # --------------------------------------------------

          rm -f repos.txt
          rm -f language_frequency.json
          rm -f language_volume.json
          rm -f hybrid_stats.json
          rm -f stats.tsv

      - name: Commit and Push Stats
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats-card.svg top-langs-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
