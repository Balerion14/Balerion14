permissions:
  contents: write

name: Update README with GitHub Stats

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GitHub Token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "ERROR: GH_STATS_TOKEN secret is missing or empty"
            exit 1
          fi

          echo "GH_STATS_TOKEN is configured"

          status=$(curl -s \
            -o /tmp/github-user.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)

          echo "GitHub API status: $status"

          if [ "$status" != "200" ]; then
            echo "GitHub response:"
            cat /tmp/github-user.json
            exit 1
          fi

          jq -r '"Authenticated as: " + .login' /tmp/github-user.json

      - name: Generate GitHub Language Stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          API_VERSION="2022-11-28"

          echo '{}' > languages.json
          : > repos.txt

          page=1

          while true; do
            echo "Fetching repositories page $page..."

            status=$(curl -s \
              -o /tmp/repos.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/user/repos?visibility=all&affiliation=owner%2Ccollaborator%2Corganization_member&per_page=100&page=$page")

            echo "Repositories API status: $status"

            if [ "$status" != "200" ]; then
              echo "GitHub response:"
              cat /tmp/repos.json
              exit 1
            fi

            count=$(jq 'length' /tmp/repos.json)

            echo "Repositories found on page: $count"

            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -r '
              .[]
              | select(.fork == false)
              | .full_name
            ' /tmp/repos.json >> repos.txt

            page=$((page + 1))
          done

          sort -u repos.txt -o repos.txt

          repo_count=$(wc -l < repos.txt)

          echo "================================"
          echo "Repositories included: $repo_count"
          echo "================================"

          cat repos.txt

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            echo ""
            echo "Processing: $repo"

            status=$(curl -s \
              -o /tmp/languages-response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/repos/$repo/languages")

            echo "Languages API status: $status"

            if [ "$status" != "200" ]; then
              echo "WARNING: Could not read languages for $repo"
              cat /tmp/languages-response.json
              continue
            fi

            echo "Languages:"
            cat /tmp/languages-response.json
            echo ""

            jq -s '
              reduce .[] as $item
                ({};
                  reduce ($item | to_entries[]) as $entry
                    (.;
                      .[$entry.key] =
                        ((.[$entry.key] // 0) + $entry.value)
                    )
                )
            ' languages.json /tmp/languages-response.json > languages.tmp.json

            mv languages.tmp.json languages.json

          done < repos.txt

          echo ""
          echo "================================"
          echo "Combined language data"
          echo "================================"

          cat languages.json

          total=$(jq '[.[]] | add // 0' languages.json)

          echo ""
          echo "Total language bytes: $total"

          jq -r \
            --argjson total "$total" '
              to_entries
              | sort_by(.value)
              | reverse
              | .[:10]
              | .[]
              | [
                  .key,
                  .value,
                  (
                    if $total > 0
                    then (.value / $total * 100)
                    else 0
                    end
                  )
                ]
              | @tsv
            ' languages.json > stats.tsv

          echo ""
          echo "================================"
          echo "Final language stats"
          echo "================================"

          cat stats.tsv

          ROWS=$(wc -l < stats.tsv)
          HEIGHT=$((80 + ROWS * 30))

          cat > top-langs-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="$HEIGHT"
               viewBox="0 0 500 $HEIGHT">

            <rect
              width="100%"
              height="100%"
              rx="6"
              fill="#0d1117"
              stroke="#30363d"
            />

            <text
              x="20"
              y="35"
              font-family="Arial, sans-serif"
              font-size="18"
              font-weight="600"
              fill="#58a6ff">
              Most Used Languages
            </text>
          EOF

          y=70

          while IFS=$'\t' read -r language bytes percentage; do
            [ -z "$language" ] && continue

            percentage=$(printf "%.1f" "$percentage")

            language_escaped=$(printf '%s' "$language" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g')

            cat >> top-langs-card.svg <<EOF
            <text
              x="20"
              y="$y"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#c9d1d9">
              $language_escaped
            </text>

            <text
              x="470"
              y="$y"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#8b949e">
              ${percentage}%
            </text>
          EOF

            y=$((y + 30))

          done < stats.tsv

          echo '</svg>' >> top-langs-card.svg

          echo ""
          echo "SVG generated successfully:"
          ls -lh top-langs-card.svg

          rm -f repos.txt
          rm -f languages.json
          rm -f stats.tsv

      - name: Commit and Push Stats
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-langs-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
