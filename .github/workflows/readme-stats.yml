permissions:
  contents: write

name: Update README with GitHub Stats

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GitHub Token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "ERROR: GH_STATS_TOKEN secret is missing or empty"
            exit 1
          fi

          status=$(curl -s \
            -o /tmp/github-user.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)

          echo "GitHub API status: $status"

          if [ "$status" != "200" ]; then
            cat /tmp/github-user.json
            exit 1
          fi

          jq -r '"Authenticated as: " + .login' /tmp/github-user.json

      - name: Generate GitHub Stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          API_VERSION="2022-11-28"

          echo '{}' > languages.json
          : > repos.txt

          page=1
          total_repos=0
          total_stars=0
          total_forks=0
          total_size=0

          while true; do
            echo "Fetching repositories page $page..."

            status=$(curl -s \
              -o /tmp/repos.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/user/repos?visibility=all&affiliation=owner%2Ccollaborator%2Corganization_member&per_page=100&page=$page")

            if [ "$status" != "200" ]; then
              echo "Repositories API failed:"
              cat /tmp/repos.json
              exit 1
            fi

            count=$(jq 'length' /tmp/repos.json)

            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -r '
              .[]
              | select(.fork == false)
              | .full_name
            ' /tmp/repos.json >> repos.txt

            page_stars=$(jq '
              [
                .[]
                | select(.fork == false)
                | .stargazers_count
              ]
              | add // 0
            ' /tmp/repos.json)

            page_forks=$(jq '
              [
                .[]
                | select(.fork == false)
                | .forks_count
              ]
              | add // 0
            ' /tmp/repos.json)

            page_size=$(jq '
              [
                .[]
                | select(.fork == false)
                | .size
              ]
              | add // 0
            ' /tmp/repos.json)

            page_repos=$(jq '
              [
                .[]
                | select(.fork == false)
              ]
              | length
            ' /tmp/repos.json)

            total_stars=$((total_stars + page_stars))
            total_forks=$((total_forks + page_forks))
            total_size=$((total_size + page_size))
            total_repos=$((total_repos + page_repos))

            page=$((page + 1))
          done

          sort -u repos.txt -o repos.txt

          echo "Repositories included:"
          cat repos.txt

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            echo "Processing languages for $repo"

            status=$(curl -s \
              -o /tmp/languages-response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/repos/$repo/languages")

            if [ "$status" != "200" ]; then
              echo "WARNING: cannot read languages for $repo"
              continue
            fi

            jq -s '
              reduce .[] as $item
                ({};
                  reduce ($item | to_entries[]) as $entry
                    (.;
                      .[$entry.key] =
                        ((.[$entry.key] // 0) + $entry.value)
                    )
                )
            ' languages.json /tmp/languages-response.json > languages.tmp.json

            mv languages.tmp.json languages.json
          done < repos.txt

          total_language_bytes=$(jq '[.[]] | add // 0' languages.json)

          jq -r \
            --argjson total "$total_language_bytes" '
              to_entries
              | sort_by(.value)
              | reverse
              | .[:10]
              | .[]
              | [
                  .key,
                  (
                    if $total > 0
                    then (.value / $total * 100)
                    else 0
                    end
                  )
                ]
              | @tsv
            ' languages.json > stats.tsv

          # ----------------------------
          # Global GitHub stats SVG
          # ----------------------------

          cat > github-stats-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="210"
               viewBox="0 0 500 210">

            <rect
              width="100%"
              height="100%"
              rx="8"
              fill="#141321"
              stroke="#30363d"
            />

            <text
              x="25"
              y="38"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700"
              fill="#fe428e">
              Balerion14's GitHub Stats
            </text>

            <text
              x="25"
              y="85"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Repositories
            </text>

            <text
              x="470"
              y="85"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $total_repos
            </text>

            <text
              x="25"
              y="120"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Stars
            </text>

            <text
              x="470"
              y="120"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $total_stars
            </text>

            <text
              x="25"
              y="155"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Forks
            </text>

            <text
              x="470"
              y="155"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              $total_forks
            </text>

            <text
              x="25"
              y="190"
              font-family="Arial, sans-serif"
              font-size="15"
              fill="#a9fef7">
              Repository size
            </text>

            <text
              x="470"
              y="190"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="600"
              fill="#f8d847">
              ${total_size} KB
            </text>

          </svg>
          EOF

          # ----------------------------
          # Top languages SVG
          # ----------------------------

          ROWS=$(wc -l < stats.tsv)
          HEIGHT=$((80 + ROWS * 30))

          cat > top-langs-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="$HEIGHT"
               viewBox="0 0 500 $HEIGHT">

            <rect
              width="100%"
              height="100%"
              rx="8"
              fill="#141321"
              stroke="#30363d"
            />

            <text
              x="20"
              y="35"
              font-family="Arial, sans-serif"
              font-size="18"
              font-weight="700"
              fill="#fe428e">
              Most Used Languages
            </text>
          EOF

          y=70

          while IFS=$'\t' read -r language percentage; do
            [ -z "$language" ] && continue

            percentage=$(printf "%.1f" "$percentage")

            language_escaped=$(printf '%s' "$language" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g')

            cat >> top-langs-card.svg <<EOF
            <text
              x="20"
              y="$y"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#a9fef7">
              $language_escaped
            </text>

            <text
              x="470"
              y="$y"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#f8d847">
              ${percentage}%
            </text>
          EOF

            y=$((y + 30))
          done < stats.tsv

          echo '</svg>' >> top-langs-card.svg

          rm -f repos.txt
          rm -f languages.json
          rm -f stats.tsv

      - name: Commit and Push Stats
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats-card.svg top-langs-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
