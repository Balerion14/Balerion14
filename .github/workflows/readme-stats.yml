permissions:
  contents: write

name: Update README with GitHub Stats

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 * * * *' # met à jour toutes les heures

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Language Stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          API_VERSION="2022-11-28"

          rm -f repos.json languages.json
          echo '{}' > languages.json

          page=1

          while true; do
            response=$(curl -sSfL \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/user/repos?visibility=all&affiliation=owner%2Ccollaborator%2Corganization_member&per_page=100&page=$page")

            count=$(echo "$response" | jq 'length')

            if [ "$count" -eq 0 ]; then
              break
            fi

            echo "$response" | jq -r '
              .[]
              | select(.fork == false)
              | .full_name
            ' >> repos.txt

            page=$((page + 1))
          done

          sort -u repos.txt -o repos.txt

          echo "Repositories included:"
          cat repos.txt

          while IFS= read -r repo; do
            echo "Processing $repo"

            response=$(curl -sSfL \
              -H "Authorization: Bearer $GH_STATS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/repos/$repo/languages")

            jq -s '
              reduce .[] as $item
                ({};
                  reduce ($item | to_entries[]) as $entry
                    (.;
                      .[$entry.key] =
                        ((.[$entry.key] // 0) + $entry.value)
                    )
                )
            ' languages.json <(echo "$response") > languages.tmp.json

            mv languages.tmp.json languages.json

          done < repos.txt

          total=$(jq '[.[]] | add // 0' languages.json)

          echo "Total bytes: $total"

          jq -r \
            --argjson total "$total" '
              to_entries
              | sort_by(.value)
              | reverse
              | .[:10]
              | .[]
              | [
                  .key,
                  .value,
                  (
                    if $total > 0
                    then (.value / $total * 100)
                    else 0
                    end
                  )
                ]
              | @tsv
            ' languages.json > stats.tsv

          echo "Language stats:"
          cat stats.tsv

          ROWS=$(wc -l < stats.tsv)
          HEIGHT=$((80 + ROWS * 30))

          cat > top-langs-card.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="500"
               height="$HEIGHT"
               viewBox="0 0 500 $HEIGHT">

            <rect
              width="100%"
              height="100%"
              rx="6"
              fill="#0d1117"
              stroke="#30363d"
            />

            <text
              x="20"
              y="35"
              font-family="Arial, sans-serif"
              font-size="18"
              font-weight="600"
              fill="#58a6ff">
              Most Used Languages
            </text>
          EOF

          y=70

          while IFS=$'\t' read -r language bytes percentage; do

            percentage=$(printf "%.1f" "$percentage")

            language_escaped=$(printf '%s' "$language" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g')

            cat >> top-langs-card.svg <<EOF
            <text
              x="20"
              y="$y"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#c9d1d9">
              $language_escaped
            </text>

            <text
              x="470"
              y="$y"
              text-anchor="end"
              font-family="Arial, sans-serif"
              font-size="14"
              fill="#8b949e">
              ${percentage}%
            </text>
          EOF

            y=$((y + 30))

          done < stats.tsv

          echo '</svg>' >> top-langs-card.svg

          rm -f repos.txt languages.json stats.tsv

      - name: Commit and Push Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-langs-card.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
